# Set active profile
spring.profiles.active=local

spring.application.name=url-short-service
spring.main.lazy-initialization=true


#Timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.date-format=dd MMMM yyyy HH:mm
server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=1000MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
spring.devtools.restart.enabled=false


# JWT Config
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# Sales target
sales.targetMonthly=1000000

# Resilience4j Rate Limiter Configuration
resilience4j.ratelimiter.instances.customerBookingRateLimiter.limit-for-period=1
resilience4j.ratelimiter.instances.customerBookingRateLimiter.limit-refresh-period=2m
resilience4j.ratelimiter.instances.customerBookingRateLimiter.timeout-duration=0

# Redis server configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=      # leave empty if no password
spring.redis.timeout=2000
spring.cache.redis.time-to-live=86400000
spring.cache.redis.cache-null-values=false
spring.cache.type=redis
logging.level.org.springframework.data.redis.repository.support=WARN


# Enable Redis as cache provider
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000



# ZooKeeper Configuration
zookeeper.connect-string=127.0.0.1:2181
zookeeper.session-timeout=60000
zookeeper.connection-timeout=15000

# ID Generator
app.id-generator.block-size=1000
